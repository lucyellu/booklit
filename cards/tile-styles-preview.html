<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Style Preview — pick one</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0a0e27; color:#fff; font-family:'Inter',system-ui,sans-serif; }
  #liquid-bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .wrap { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  header { padding:18px 22px 10px; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.01em; }
  .sub { color:rgba(255,255,255,0.65); font-size:13px; margin-top:3px; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; padding:14px 22px 6px; }
  .tab {
    padding:9px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
    color:rgba(255,255,255,0.7); border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:all .25s ease; white-space:nowrap;
  }
  .tab:hover { color:#fff; border-color:rgba(255,255,255,0.4); transform:translateY(-1px); }
  .tab.active { color:#06231a; background:#fff; border-color:#fff; }

  .desc { padding:4px 22px 0; font-size:13px; color:rgba(255,255,255,0.7); min-height:34px; max-width:760px; }

  .schemes { display:flex; gap:8px; align-items:center; padding:6px 22px 12px; }
  .schemes .lbl { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.5); margin-right:4px; }
  .sdot { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,0.4); transition:transform .2s; }
  .sdot:hover { transform:scale(1.15); }
  .sdot.active { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.3); }

  .grid { flex:1; overflow-y:auto; padding:8px 22px 40px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:18px; align-content:start; }

  .tile {
    position:relative; aspect-ratio:2/3; border-radius:12px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; justify-content:flex-end;
    border:1px solid rgba(255,255,255,0.16); transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .tile:hover { transform:translateY(-4px); box-shadow:0 16px 36px rgba(0,0,0,0.45); }
  .tile .meta { position:relative; z-index:3; padding:12px; }
  .tile .t { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; line-height:1.15; }
  .tile .a { font-size:11px; color:rgba(255,255,255,0.75); margin-top:3px; }
  .tile .scrim { position:absolute; inset:0; z-index:2; background:linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 45%, transparent 70%); }
  .tile canvas, .tile .fill { position:absolute; inset:0; z-index:1; width:100%; height:100%; }

  /* GLASS — frosted, the page gradient shows through */
  .tile.glass { background:rgba(255,255,255,0.06); backdrop-filter:blur(6px) saturate(140%); -webkit-backdrop-filter:blur(6px) saturate(140%); }
  .tile.glass .scrim { background:linear-gradient(to top, rgba(0,0,0,0.45), transparent 60%); }

  /* BLOCK — minimal standin: dark frosted block + colored edge */
  .tile.block { background:rgba(10,12,30,0.42); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .tile.block .edge { position:absolute; left:0; top:0; bottom:0; width:6px; z-index:2; }

  /* CSS LIQUID — animated multi-radial blobs */
  @keyframes drift1 { 0%{background-position:0% 0%,100% 100%,50% 50%} 50%{background-position:60% 40%,20% 70%,80% 20%} 100%{background-position:0% 0%,100% 100%,50% 50%} }
  .tile .fill.cssliquid { background-repeat:no-repeat; background-size:160% 160%,150% 150%,180% 180%; animation:drift1 var(--dur,14s) ease-in-out infinite; animation-delay:var(--delay,0s); }

  .hint { position:fixed; bottom:0; left:0; right:0; z-index:2; text-align:center; padding:8px;
    font-size:12px; color:rgba(255,255,255,0.55); background:linear-gradient(to top, rgba(10,14,39,0.8), transparent); pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Book Tile Styles</h1>
    <div class="sub">Same 12 placeholder books, rendered 5 ways over the live liquid gradient. Flip tabs, switch palettes, then tell me the one you want.</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="desc" id="desc"></div>
  <div class="schemes" id="schemes"><span class="lbl">Palette</span></div>
  <div class="grid" id="grid"></div>
</div>
<div class="hint">Hover a tile to feel the motion · pick by name (e.g. “Glass” or “CSS liquid”)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------- sample data ---------------- */
const BOOKS = [
  ['The Beginning of Infinity','David Deutsch'],['Gödel, Escher, Bach','Douglas Hofstadter'],
  ['The Making of the Atomic Bomb','Richard Rhodes'],['Seeing Like a State','James C. Scott'],
  ['The Power Broker','Robert Caro'],['Thinking in Systems','Donella Meadows'],
  ['Surely You’re Joking','Richard Feynman'],['The Box','Marc Levinson'],
  ['Where Is My Flying Car?','J. Storrs Hall'],['The Dream Machine','M. Mitchell Waldrop'],
  ['Zero to One','Peter Thiel'],['The Innovators','Walter Isaacson']
];

/* ---------------- palettes (from the liquid schemes) ---------------- */
const SCHEMES = {
  1:{ name:'Orange / Navy', dots:['#F15A22','#0a0e27'], colors:['#F15A22','#0a0e27','#FF7A3C','#0a0e27'] },
  2:{ name:'Coral / Turquoise', dots:['#FF6C50','#40E0D0'], colors:['#FF6C50','#40E0D0','#FF8A6B','#1f7a86'] },
  3:{ name:'Orange+Navy+Teal', dots:['#F15A22','#40E0D0'], colors:['#F15A22','#0a0e27','#40E0D0','#0a0e27'] },
  4:{ name:'Coral / Teal / Peach', dots:['#F26633','#2D6B6D'], colors:['#F26633','#2D6B6D','#D1AF9C','#2D6B6D'] },
  5:{ name:'Orange / Deep Teal', dots:['#F15A22','#004238'], colors:['#F15A22','#004238','#F15A22','#001a16'] }
};
let scheme = 1;

/* deterministic per-book hash */
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function pick(arr,n){ return arr[n%arr.length]; }

/* ---------------- tile renderers ---------------- */
const miniTimers = [];
function clearMinis(){ miniTimers.forEach(id=>cancelAnimationFrame(id)); miniTimers.length=0; }

const STYLES = {
  glass: {
    label:'Glass', desc:'Frosted translucent tiles — the live moving gradient shows straight through each one. Most cohesive & minimal; tiles shimmer as the background drifts.',
    build(tile){ tile.classList.add('glass'); }
  },
  seeded: {
    label:'Seeded gradient', desc:'Each tile is its own static gradient, with colors picked deterministically from the palette by a hash of the title. Crisp, varied, on-theme, and zero animation cost.',
    build(tile,b,i){ const h=hash(b[0]); const c1=pick(SCHEMES[scheme].colors,h); const c2=pick(SCHEMES[scheme].colors,h>>3); const ang=30+(h%120); const f=document.createElement('div'); f.className='fill'; f.style.background=`linear-gradient(${ang}deg, ${c1}, ${c2})`; tile.appendChild(f); }
  },
  cssliquid: {
    label:'CSS liquid', desc:'Each tile = its own animated liquid blob (3 drifting radial gradients), seeded so every book moves differently. The look you picked — done in GPU-composited CSS so 700+ tiles stay smooth.',
    build(tile,b,i){ const h=hash(b[0]); const cs=SCHEMES[scheme].colors; const c1=pick(cs,h),c2=pick(cs,h>>2),c3=pick(cs,h>>4);
      const f=document.createElement('div'); f.className='fill cssliquid';
      f.style.background=`radial-gradient(60% 60% at 30% 30%, ${c1}, transparent 70%), radial-gradient(55% 55% at 75% 65%, ${c2}, transparent 70%), radial-gradient(70% 70% at 50% 90%, ${c3}, transparent 75%), ${cs[1]}`;
      f.style.setProperty('--dur',(10+(h%10))+'s'); f.style.setProperty('--delay',-(h%8)+'s');
      tile.appendChild(f); }
  },
  minishader: {
    label:'Mini shader (heavy)', desc:'Each tile runs its OWN tiny animated liquid canvas — the most alive, but every visible tile is a separate animation loop. Fine for a dozen; risky for hundreds (the real reason the others exist).',
    build(tile,b,i){ const cv=document.createElement('canvas'); cv.width=120; cv.height=180; tile.appendChild(cv); startMini(cv, hash(b[0])); }
  },
  block: {
    label:'Block / standin', desc:'Bare placeholder: a dark frosted block with a single palette-colored edge. The literal “blocker” look — quiet, uniform, lets the background and typography lead.',
    build(tile,b,i){ tile.classList.add('block'); const e=document.createElement('div'); e.className='edge'; e.style.background=pick(SCHEMES[scheme].colors,hash(b[0])); tile.appendChild(e); }
  }
};

/* tiny per-tile liquid (canvas 2D blobs) */
function startMini(cv, seed){
  const ctx=cv.getContext('2d'); const cs=SCHEMES[scheme].colors;
  const blobs=[0,1,2,3].map(k=>({ c:pick(cs,seed>>(k*2)), x:Math.random(), y:Math.random(), px:0.2+0.6*((seed>>(k*3))%100)/100, py:0.2+0.6*((seed>>(k*4))%100)/100, sp:0.3+0.5*Math.random(), ph:(seed%628)/100+k }));
  let t=(seed%1000)/100;
  function frame(){
    t+=0.012; ctx.fillStyle=cs[1]; ctx.fillRect(0,0,cv.width,cv.height);
    blobs.forEach(b=>{ const x=(0.5+Math.sin(t*b.sp+b.ph)*0.35)*cv.width; const y=(0.5+Math.cos(t*b.sp*0.8+b.ph)*0.35)*cv.height;
      const g=ctx.createRadialGradient(x,y,0,x,y,cv.width*0.8); g.addColorStop(0,b.c); g.addColorStop(1,'transparent');
      ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,cv.width*0.9,0,7); ctx.fill(); });
    ctx.globalCompositeOperation='source-over';
    miniTimers.push(requestAnimationFrame(frame));
  }
  frame();
}

/* ---------------- render ---------------- */
let current='glass';
function render(){
  clearMinis();
  const grid=document.getElementById('grid'); grid.innerHTML='';
  document.getElementById('desc').textContent=STYLES[current].desc;
  BOOKS.forEach((b,i)=>{
    const tile=document.createElement('div'); tile.className='tile';
    STYLES[current].build(tile,b,i);
    const scrim=document.createElement('div'); scrim.className='scrim'; tile.appendChild(scrim);
    const meta=document.createElement('div'); meta.className='meta';
    meta.innerHTML=`<div class="t">${b[0]}</div><div class="a">${b[1]}</div>`;
    tile.appendChild(meta); grid.appendChild(tile);
  });
}

/* tabs + schemes UI */
const tabsEl=document.getElementById('tabs');
Object.keys(STYLES).forEach(k=>{ const t=document.createElement('div'); t.className='tab'+(k===current?' active':''); t.textContent=STYLES[k].label; t.onclick=()=>{ current=k; [...tabsEl.children].forEach(c=>c.classList.remove('active')); t.classList.add('active'); render(); }; tabsEl.appendChild(t); });
const schEl=document.getElementById('schemes');
Object.keys(SCHEMES).forEach(n=>{ const d=document.createElement('div'); d.className='sdot'+(+n===scheme?' active':''); d.title=SCHEMES[n].name; d.style.background=`linear-gradient(135deg, ${SCHEMES[n].dots[0]}, ${SCHEMES[n].dots[1]})`; d.onclick=()=>{ scheme=+n; [...schEl.querySelectorAll('.sdot')].forEach(c=>c.classList.remove('active')); d.classList.add('active'); setBgScheme(scheme); render(); }; schEl.appendChild(d); });

/* ---------------- background liquid gradient (shared, full screen) ---------------- */
const O=h=>new THREE.Vector3(((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255);
const BG={1:[O(0xF15A22),O(0x0a0e27)],2:[O(0xFF6C50),O(0x40E0D0)],3:[O(0xF15A22),O(0x40E0D0)],4:[O(0xF26633),O(0x2D6B6D)],5:[O(0xF15A22),O(0x004238)]};
let renderer,camera,sceneT,mesh,uni,clock;
function initBg(){
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  renderer.domElement.id='liquid-bg'; document.body.appendChild(renderer.domElement);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000); camera.position.z=50; sceneT=new THREE.Scene(); clock=new THREE.Clock();
  uni={ uTime:{value:0}, uC1:{value:BG[1][0]}, uC2:{value:BG[1][1]}, uRes:{value:new THREE.Vector2(innerWidth,innerHeight)} };
  const f=(45*Math.PI)/180, h=Math.abs(50*Math.tan(f/2)*2), w=h*camera.aspect;
  mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.ShaderMaterial({uniforms:uni,
    vertexShader:`varying vec2 v; void main(){ gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); v=uv; }`,
    fragmentShader:`uniform float uTime; uniform vec3 uC1,uC2; varying vec2 v;
      void main(){ vec2 uv=v; float t=uTime*0.4;
        vec2 a=vec2(0.5+sin(t*0.9)*0.4,0.5+cos(t)*0.4), b=vec2(0.5+cos(t*1.2)*0.5,0.5+sin(t*0.9)*0.5), c=vec2(0.5+sin(t*0.7)*0.45,0.5+cos(t*1.1)*0.45);
        float i1=1.0-smoothstep(0.0,0.5,length(uv-a)), i2=1.0-smoothstep(0.0,0.5,length(uv-b)), i3=1.0-smoothstep(0.0,0.5,length(uv-c));
        vec3 col=uC1*i1*0.6 + uC2*i2*1.3 + uC1*i3*0.5;
        col=mix(uC2,col,max(length(col)*1.2,0.18));
        col=clamp(col,0.0,1.0); gl_FragColor=vec4(col,1.0); }`}));
  sceneT.add(mesh); tick();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); uni.uRes.value.set(innerWidth,innerHeight);
    const h2=Math.abs(50*Math.tan(f/2)*2); mesh.geometry.dispose(); mesh.geometry=new THREE.PlaneGeometry(h2*camera.aspect,h2); });
}
function setBgScheme(n){ uni.uC1.value.copy(BG[n][0]); uni.uC2.value.copy(BG[n][1]); }
function tick(){ uni.uTime.value+=Math.min(clock.getDelta(),0.1); renderer.render(sceneT,camera); requestAnimationFrame(tick); }

initBg();
render();
</script>
</body>
</html>
